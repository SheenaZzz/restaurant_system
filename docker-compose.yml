name: restaurant-system

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 全链路统一 UTC，避免夏令时和时区歧义
      TZ: UTC
      PGTZ: UTC
    volumes:
      # 命名卷：容器删了数据还在。这是"拔电源不丢数据"的第一层
      - pgdata:/var/lib/postgresql/data
    ports:
      # 只绑到回环地址，不暴露给局域网
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        # 等 healthcheck 通过再启动，而不是等容器"起来"
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # iPad 真机测试时才启用： docker compose --profile lan up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["lan"]
    restart: unless-stopped
    ports:
      - "443:443"
      # 明文对照站点：用来演示"没有 HTTPS 就没有 Service Worker"
      - "8080:8080"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      # ⚠️ 用绑定挂载而不是命名卷：本地 CA 的私钥存在这里，
      #    放命名卷里会被 `docker compose down -v` 一起删掉 ——
      #    CA 一换，所有 iPad 上装的根证书立刻失效，必须重装。
      #    （里面有私钥，已在 .gitignore 排除）
      - ./ops/caddy-data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_config:
