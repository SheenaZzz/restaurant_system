name: restaurant-system

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # UTC end to end, so DST and time zones cannot be ambiguous
      TZ: UTC
      PGTZ: UTC
    volumes:
      # A named volume: the data survives the container. First layer of "a power cut loses nothing"
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to loopback only, never exposed to the LAN
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      # Containers run UTC end to end (see db), but **the business day and the
      # lunch/dinner split follow the store's clock**, so its time zone is given
      # separately. An IANA name rather than a fixed offset, or DST breaks it.
      STORE_TZ: ${STORE_TZ:-America/Los_Angeles}
      # Where the business day starts (store local time, on the hour). 0 = midnight.
      BUSINESS_DAY_CUTOFF_HOUR: ${BUSINESS_DAY_CUTOFF_HOUR:-0}
    depends_on:
      db:
        # Wait for the healthcheck, not merely for the container to exist
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # Only for testing on a real iPad: docker compose --profile lan up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["lan"]
    restart: unless-stopped
    ports:
      - "443:443"
      # A plaintext site for contrast: it demonstrates "no HTTPS, no Service Worker"
      - "8080:8080"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      # ⚠️ A bind mount rather than a named volume: the local CA's private key
      #    lives here, and in a named volume `docker compose down -v` would take
      #    it with it -- a new CA instantly invalidates the root certificate on
      #    every iPad, which then has to be installed again.
      #    (It holds a private key and is gitignored.)
      - ./ops/caddy-data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_config:
